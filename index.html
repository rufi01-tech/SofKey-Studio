<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SofKey Studio</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* Верхняя панель */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }

  .logo-frame {
    width: 40px;
    height: 40px;
    border: 2px solid #000;
    flex-shrink: 0;
    overflow: hidden;
  }

  .logo-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .about-btn {
    border: 1px solid #000;
    background: none;
    padding: 8px 14px;
    font-size: 14px;
  }

  /* Список комиксов */
  main {
    padding: 16px;
  }

  .comics-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .comic-card {
    aspect-ratio: 9 / 16;
    border: 2px solid #000;
  }
</style>
</head>
